<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>大樓管理費清單</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fa;
    }

    header {
      background: #0078D4;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f0f2f5;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .delete-btn {
      background: #d83b01;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #a52600;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h1>🏢 大樓管理費清單</h1>
  </header>

  <div class="container">
    <table id="buildingsTable">
      <thead>
        <tr>
          <th>編號</th>
          <th>名稱</th>
          <th>未稅未管銷</th>
          <th>含稅含管銷</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="summary"></div>
  </div>

  <footer>© 2025 物業管理系統</footer>

  <!-- ✅ 引用同一支 JS -->
  <script src="js/buildings.js"></script>
  <script>
    // ✅ 只需要載入清單，不需要載入 items
    loadBuildings();
  </script>

</body>

</html>
