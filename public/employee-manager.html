<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>會議參加人員管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      background: #f5f7fa;
      margin: 0;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h2 {
      color: #0078D4;
      margin: 0;
    }

    section {
      background: #fff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    h3 {
      margin-top: 0;
      color: #333;
    }

    textarea {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px 16px;
      margin: 4px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background: #0078D4;
      color: white;
    }

    button:hover {
      background: #005ea2;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #fff;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #eee;
    }

    @media (max-width: 600px) {

      table,
      thead,
      tbody,
      th,
      td,
      tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px;
        background: #fff;
      }

      td {
        border: none;
        text-align: left;
        padding: 6px 0;
        position: relative;
      }

      td::before {
        content: attr(data-label);
        font-weight: bold;
        margin-right: 10px;
        color: #555;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>👥 會議參加人員管理</h2>
  </header>

  <section>
    <h3>📥 Excel 複製貼上新增參加人員</h3>
    <textarea id="excelPaste" placeholder="請從 Excel 貼上員工資料（格式：員工編號 部門 姓名 職稱，每行一筆）"></textarea>
    <button onclick="addAttendees()">新增名單</button>
  </section>

  <section>
    <h3 id="signedTitle">👀 目前參加人員列表</h3>
    <table id="attendeeTable">
      <thead>
        <tr>
          <th>員工編號</th>
          <th>部門名稱</th>
          <th>員工姓名</th>
          <th>職稱</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <!-- ✅ 新增全部刪除按鈕 -->
    <button style="background:#d9534f;" onclick="deleteMeetingAttendees()">清空該場會議的參加人員</button>
  </section>

  <script>
    async function deleteMeetingAttendees() {
      if (!confirm("⚠️ 確定要清空該場會議的所有參加人員嗎？此操作無法復原！")) return;

      const resp = await fetch(`/api/meetings/${meetingId}/attendees`, { method: 'DELETE' });
      const data = await resp.json();

      if (resp.ok) {
        alert("🗑️ 已清空該場會議的參加人員");
        loadAttendees();
      } else {
        alert("❌ 刪除失敗：" + (data.error || "未知錯誤"));
      }
    }


    // 從 URL 取得 meetingId
    const urlParams = new URLSearchParams(window.location.search);
    const meetingId = urlParams.get('meetingId');
    let attendees = [];

    async function loadAttendees() {
      const res = await fetch(`/api/meetings/${meetingId}/attendees`);
      attendees = await res.json();
      renderTable(attendees);

      // ✅ 更新標題文字
      document.getElementById('signedTitle').textContent = `👀 目前參加人員列表 (${attendees.length} 位)`;
    }

    function renderTable(data) {
      const tbody = document.querySelector('#attendeeTable tbody');
      tbody.innerHTML = '';
      for (const emp of data) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td data-label="員工編號">${emp.employeeId}</td>
          <td data-label="部門名稱">${emp.department || ''}</td>
          <td data-label="員工姓名">${emp.name || ''}</td>
          <td data-label="職稱">${emp.title || ''}</td>
          <td data-label="操作">
            <button style="background:#d9534f;" onclick="deleteAttendee('${emp.employeeId}')">刪除</button>
          </td>
        `;
        tbody.appendChild(row);
      }
    }
    // 新增參加人員
    async function addAttendees() {
      const raw = document.getElementById('excelPaste').value.trim();
      if (!raw) return alert("請貼上員工資料");

      const lines = raw.split('\n').map(x => x.trim()).filter(x => x);
      let errors = [];

      try {
        for (const line of lines) {
          const [id, department, name, title] = line.split('\t');
          if (!id || !department || !name) {
            errors.push(`格式錯誤：${line}`);
            continue;
          }

          // 第一步：新增員工
          const empResp = await fetch(`/api/employees`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, department, name, title })
          });

          if (!empResp.ok) {
            const empData = await empResp.json().catch(() => ({}));
            console.warn(`⚠️ 新增員工失敗 ${id}：${empData.error || "可能已存在"}`);
          }

          // 第二步：新增到會議
          const attResp = await fetch(`/api/meetings/${meetingId}/attendees`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              employeeId: id,
              department,
              name,
              title
            })
          });

          if (!attResp.ok) {
            const attData = await attResp.json().catch(() => ({}));
            errors.push(`新增參加人員失敗 ${id}：${attData.error || "未知錯誤"}`);
          }
        }

        if (errors.length > 0) {
          alert("⚠️ 部分資料有問題：\n" + errors.join("\n"));
        } else {
          alert("✅ 名單已新增完成");
        }

        document.getElementById('excelPaste').value = '';
        loadAttendees();
      } catch (err) {
        alert("❌ 發生錯誤：" + err.message);
      }
    }


    // 刪除單一參加人員
    async function deleteAttendee(employeeId) {
      if (!confirm(`確定要刪除員工 ${employeeId} 嗎？`)) return;
      const resp = await fetch(`/api/meetings/${meetingId}/attendees/${employeeId}`, { method: 'DELETE' });
      if (resp.ok) {
        alert("🗑️ 已刪除");
        loadAttendees();
      } else {
        const data = await resp.json();
        alert("❌ 刪除失敗：" + (data.error || "未知錯誤"));
      }
    }

    loadAttendees();
  </script>
</body>

</html>
